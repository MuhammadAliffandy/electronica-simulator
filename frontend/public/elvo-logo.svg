<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="elvoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#8900ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Shield/Hexagon -->
  <polygon points="256,24 480,128 480,384 256,488 32,384 32,128" fill="#111827" stroke="url(#elvoGrad)" stroke-width="24" stroke-linejoin="round"/>
  <!-- Central Circuit Node -->
  <circle cx="256" cy="256" r="48" fill="url(#elvoGrad)" filter="url(#glow)"/>
  <!-- Top Wire -->
  <path d="M256,128 L256,208" fill="none" stroke="#00d4ff" stroke-width="20" stroke-linecap="round"/>
  <!-- Bottom Left Wire -->
  <path d="M128,336 L214,286" fill="none" stroke="#00d4ff" stroke-width="20" stroke-linecap="round"/>
  <!-- Bottom Right Wire -->
  <path d="M384,336 L298,286" fill="none" stroke="#8900ff" stroke-width="20" stroke-linecap="round"/>
  <!-- Left Wire -->
  <path d="M96,256 L180,256" fill="none" stroke="#00d4ff" stroke-width="20" stroke-linecap="round"/>
  <!-- Right Wire -->
  <path d="M416,256 L332,256" fill="none" stroke="#8900ff" stroke-width="20" stroke-linecap="round"/>
  <!-- E L V O letters overlay -->
  <text x="256" y="276" font-family="sans-serif" font-weight="900" font-size="64" fill="#ffffff" text-anchor="middle" letter-spacing="2">ELVO</text>
</svg>
